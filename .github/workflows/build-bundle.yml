name: Build Cactus Model Bundle

on:
  workflow_dispatch:
    inputs:
      model_id:
        description: 'HuggingFace model id (e.g. Cactus-Compute/gemma-3-270m-it)'
        required: true
        default: 'Cactus-Compute/gemma-3-270m-it'
      bits:
        description: 'Quantization bits (4 or 8)'
        required: false
        default: '4'
      source_model:
        description: 'Stock HF model id the converter loads for graph capture (e.g. Qwen/Qwen3-0.6B)'
        required: false
        default: 'Qwen/Qwen3-0.6B'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  convert:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Cactus Python package with convert deps
        run: |
          cd python
          pip install -e ".[convert]"

      - name: Build Cactus Python FFI library
        run: |
          sudo apt-get update && sudo apt-get install -y cmake build-essential libcurl4-openssl-dev
          cd python
          cactus build --python 2>&1 | tail -20
          # Verify the shared lib exists
          find . -name "libcactus_engine.so" 2>/dev/null | head

      - name: Download CQ weights archive
        id: download
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          MODEL_ID="${{ github.event.inputs.model_id }}"
          BITS="${{ github.event.inputs.bits }}"
          # Use the -cq repo which ships weights_manifest.json (needed by transpile).
          # L1.zip contains all weights + the manifest.
          CQ_REPO="${MODEL_ID}-cq"
          NAME=$(echo "$MODEL_ID" | awk -F/ '{print $NF}' | tr '[:upper:]' '[:lower:]')
          echo "Downloading $CQ_REPO L1.zip..."
          curl -sSL -o /tmp/weights.zip \
            "https://huggingface.co/$CQ_REPO/resolve/main/L1.zip"
          ls -lh /tmp/weights.zip
          mkdir -p /tmp/weights
          cd /tmp/weights
          unzip -q /tmp/weights.zip
          echo "Extracted files: $(ls | wc -l)"
          test -f config.txt && echo "✓ config.txt present" || echo "✗ config.txt MISSING"
          test -f weights_manifest.json && echo "✓ weights_manifest.json present" || echo "✗ weights_manifest.json MISSING"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "bits=$BITS" >> "$GITHUB_OUTPUT"

      - name: Transpile into runnable bundle
        id: transpile
        run: |
          set -o pipefail
          MODEL_ID="${{ github.event.inputs.model_id }}"
          SOURCE_MODEL="${{ github.event.inputs.source_model }}"
          # Cactus-Compute -cq repos ship only CQ weights; the converter loads the
          # stock source model for graph capture, weights come from the CQ dir.
          python scripts/transpile_bundle.py /tmp/weights /tmp/bundle --model-id "$MODEL_ID" --source-model "$SOURCE_MODEL" 2>&1 | tail -30
          echo "Bundle contents:"
          ls -la /tmp/bundle/
          test -f /tmp/bundle/components/manifest.json && echo "✓ manifest.json present" || echo "✗ manifest.json MISSING"

      - name: Package bundle as zip
        run: |
          NAME="${{ steps.download.outputs.name }}"
          BITS="${{ steps.download.outputs.bits }}"
          cd /tmp/bundle
          zip -r "/tmp/${NAME}-cq${BITS}.zip" . -x "transpiler_ir/*"
          ls -lh "/tmp/${NAME}-cq${BITS}.zip"

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: cactus-bundle-${{ steps.download.outputs.name }}-cq${{ steps.download.outputs.bits }}
          path: /tmp/${{ steps.download.outputs.name }}-cq${{ steps.download.outputs.bits }}.zip
          if-no-files-found: error
