name: Android App Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - android-app/**
      - .github/workflows/android-app.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Download Cactus Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: cactus-android-arm64
          path: android-app/app/src/main/jniLibs/arm64-v8a/

      - name: Verify native library present
        run: |
          ls -la android-app/app/src/main/jniLibs/arm64-v8a/
          test -f android-app/app/src/main/jniLibs/arm64-v8a/libcactus_engine.so && echo "✓ libcactus_engine.so present"

      - name: Bootstrap Gradle wrapper
        run: |
          cd android-app
          curl -sSL -o gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle.zip
          ./gradle-8.9/bin/gradle wrapper --gradle-version 8.9
          rm -rf gradle.zip gradle-8.9

      - name: Build debug APK
        run: |
          cd android-app
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cactus-demo-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
